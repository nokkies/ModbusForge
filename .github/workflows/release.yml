name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2026.8.18)'
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Create as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.actor != 'github-actions[bot]')
    runs-on: windows-latest

    # A stuck publish must not occupy the (single) release lane for 6 hours.
    timeout-minutes: 90

    # Two pushes of the same tag (e.g. a force-push re-run) must not race on the
    # same GitHub Release; queue them instead.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Compute version and tag
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ github.event.inputs.version }}'.TrimStart('v')
            $tag = "v$version"
          } else {
            $tag = '${{ github.ref_name }}'
            $version = $tag.TrimStart('v')
          }

          if (-not $version) {
            Write-Error 'Could not determine release version.'
            exit 1
          }

          if ($version -notmatch '^\d{4}\.\d{1,2}\.\d+$') {
            Write-Error "Version '$version' does not match the required CalVer pattern (YYYY.M.INCREMENT)."
            exit 1
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Verify version agreement (tag vs csproj)
        shell: pwsh
        run: |
          # The three policy-tracked csproj files must all agree with each other
          # and with the release version. A mistag used to ship binaries whose
          # assembly version differs from what the repo documents.
          $version = '${{ steps.version.outputs.version }}'
          $csprojFiles = @(
            '.\ModbusForge\ModbusForge.csproj',
            '.\ModbusForge.Core\ModbusForge.Core.csproj',
            '.\ModbusForge.Headless\ModbusForge.Headless.csproj'
          )
          $problems = @()
          foreach ($file in $csprojFiles) {
            $xml = [xml](Get-Content $file -Raw)
            $v = @($xml.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
            if ($v.Count -eq 0) {
              $problems += "$file : no <Version> element found"
            } elseif ($v[0] -ne $version) {
              $problems += "$file : '$($v[0])' != release version '$version'"
            }
          }
          if ($problems.Count -gt 0) {
            Write-Error "Release version mismatch:`n" + ($problems -join "`n")
            exit 1
          }
          Write-Host "All three csproj files agree with release version $version."

      - name: Check code-signing secrets
        id: codesign
        shell: pwsh
        run: |
          $cert = '${{ secrets.CODESIGN_CERTIFICATE_BASE64 }}'
          $password = '${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}'
          if ($cert -and $password) {
            'has-cert=true' >> $env:GITHUB_OUTPUT
          } else {
            'has-cert=false' >> $env:GITHUB_OUTPUT
          }

      - name: Determine release flags
        id: flags
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            'draft=${{ github.event.inputs.draft }}' >> $env:GITHUB_OUTPUT
            'prerelease=${{ github.event.inputs.prerelease }}' >> $env:GITHUB_OUTPUT
          } else {
            'draft=false' >> $env:GITHUB_OUTPUT
            'prerelease=false' >> $env:GITHUB_OUTPUT
          }

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          dotnet build ModbusForge.sln -c Release --no-restore `
            -p:Version=$version `
            -p:AssemblyVersion=$version.0 `
            -p:FileVersion=$version.0

      - name: Test (Windows, no UI/Smoke)
        shell: pwsh
        run: |
          dotnet test ModbusForge.Tests/ModbusForge.Tests.csproj -c Release --no-build `
            --filter 'FullyQualifiedName!~UITests & FullyQualifiedName!~SmokeTests'
          dotnet test ModbusForge.Headless.Tests/ModbusForge.Headless.Tests.csproj -c Release --no-build
          dotnet test ModbusForge.Avalonia.Tests/ModbusForge.Avalonia.Tests.csproj -c Release --no-build

      - name: Publish Avalonia (Windows)
        run: >
          dotnet publish .\ModbusForge\ModbusForge.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          -o .\publish\avalonia\win-x64

      - name: Publish Avalonia (Linux)
        run: >
          dotnet publish .\ModbusForge\ModbusForge.csproj -c Release -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          -o .\publish\avalonia\linux-x64

      - name: Publish Headless (Windows)
        run: >
          dotnet publish .\ModbusForge.Headless\ModbusForge.Headless.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          -o .\publish\headless\win-x64

      - name: Publish Headless (Linux)
        run: >
          dotnet publish .\ModbusForge.Headless\ModbusForge.Headless.csproj -c Release -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          -o .\publish\headless\linux-x64

      - name: Strip debug symbols from publish outputs
        shell: pwsh
        run: |
          Get-ChildItem -Path .\publish -Filter '*.pdb' -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Code sign Windows executables (optional)
        if: ${{ steps.codesign.outputs.has-cert == 'true' }}
        shell: pwsh
        run: |
          $cert = [System.Convert]::FromBase64String('${{ secrets.CODESIGN_CERTIFICATE_BASE64 }}')
          [System.IO.File]::WriteAllBytes('codesign.pfx', $cert)

          # Prefer the 64-bit signtool: from a 64-bit pwsh the 32-bit binary can
          # fail on large inputs, and Select-Object -First 1 used to grab
          # whichever SDK version happened to sort first.
          $signtool = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) {
            Write-Error 'signtool.exe not found. Install the Windows SDK on the runner.'
            exit 1
          }

          # Sign both Windows executables shipped as release assets.
          $targets = @(
            '.\publish\avalonia\win-x64\ModbusForge.exe',
            '.\publish\headless\win-x64\ModbusForge.Headless.exe'
          )
          foreach ($target in $targets) {
            if (-not (Test-Path $target)) {
              Write-Error "Signing target not found: $target"
              exit 1
            }
            & $signtool sign `
              /f codesign.pfx `
              /p '${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}' `
              /tr https://timestamp.digicert.com `
              /td sha256 /fd sha256 /a `
              $target
            if ($LASTEXITCODE -ne 0) {
              Write-Error "signtool failed for $target (exit $LASTEXITCODE)"
              exit 1
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --version 6.4.1

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          Write-Host "Building installer with version $version..."
          & iscc /DAppVersion=$version setup\ModbusForge.iss
          if (-not (Test-Path .\installers)) {
            Write-Error 'Installers directory not found after Inno Setup build.'
            exit 1
          }

      - name: Code sign installer (optional)
        if: ${{ steps.codesign.outputs.has-cert == 'true' }}
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $cert = [System.Convert]::FromBase64String('${{ secrets.CODESIGN_CERTIFICATE_BASE64 }}')
          [System.IO.File]::WriteAllBytes('codesign.pfx', $cert)

          $signtool = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) {
            Write-Error 'signtool.exe not found. Install the Windows SDK on the runner.'
            exit 1
          }

          $installer = ".\installers\ModbusForge-$version-setup.exe"
          & $signtool sign `
            /f codesign.pfx `
            /p '${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}' `
            /tr https://timestamp.digicert.com `
            /td sha256 /fd sha256 /a `
            $installer
          if ($LASTEXITCODE -ne 0) {
            Write-Error "signtool failed for $installer (exit $LASTEXITCODE)"
            exit 1
          }

      - name: Package release artifacts
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          if (Test-Path .\packages) { Remove-Item -Path .\packages -Recurse -Force }
          New-Item -ItemType Directory -Path .\packages -Force | Out-Null

          # Avalonia Windows
          Compress-Archive -Path '.\publish\avalonia\win-x64\*' `
            -DestinationPath ".\packages\ModbusForge-$version-win-x64.zip" -Force

          # Avalonia Linux
          $staging = ".\packages\ModbusForge"
          if (Test-Path $staging) { Remove-Item -Path $staging -Recurse -Force }
          Copy-Item -Path '.\publish\avalonia\linux-x64' -Destination $staging -Recurse
          tar -czf ".\packages\ModbusForge-$version-linux-x64.tar.gz" -C .\packages ModbusForge
          Remove-Item -Path $staging -Recurse -Force

          # Headless Windows
          Compress-Archive -Path '.\publish\headless\win-x64\*' `
            -DestinationPath ".\packages\ModbusForge-$version-headless-win-x64.zip" -Force

          # Headless Linux
          $staging = ".\packages\ModbusForge.Headless"
          if (Test-Path $staging) { Remove-Item -Path $staging -Recurse -Force }
          Copy-Item -Path '.\publish\headless\linux-x64' -Destination $staging -Recurse
          tar -czf ".\packages\ModbusForge-$version-headless-linux-x64.tar.gz" -C .\packages ModbusForge.Headless
          Remove-Item -Path $staging -Recurse -Force

          # Copy installer into packages for a single release asset location
          Copy-Item -Path ".\installers\ModbusForge-$version-setup.exe" `
            -Destination ".\packages\ModbusForge-$version-setup.exe" -Force

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path .\packages -File -Filter 'ModbusForge-*'
          foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLower()
            $out = "$hash  $($f.Name)"
            $out | Out-File -FilePath "$($f.FullName).sha256" -Encoding ascii -NoNewline
          }

      - name: Validate installer asset name
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $installer = ".\packages\ModbusForge-$version-setup.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer asset not found: $installer"
            exit 1
          }
          $size = (Get-Item $installer).Length
          if ($size -eq 0) {
            Write-Error 'Installer asset is empty.'
            exit 1
          }
          Write-Host "Installer asset validated: $installer ($size bytes)"

      - name: Generate release notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $lines = Get-Content README.md
          $foundWhatsNew = $false
          $collect = $false
          $notes = @()

          foreach ($line in $lines) {
            if ($line -match '^## What''s New') {
              $foundWhatsNew = $true
              continue
            }

            if ($foundWhatsNew -and $line -match '^### ') {
              if ($collect) { break }
              $collect = $true
            }

            if ($collect) {
              $notes += $line
            }
          }

          if ($notes.Count -eq 0) {
            $notes = @('See [README.md](README.md) for the full changelog.')
          }

          $header = "# ModbusForge v$version"
          $body = "$header`n`n" + ($notes -join "`n")
          $body | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ModbusForge-${{ steps.version.outputs.tag }}
          path: packages/ModbusForge-*
          if-no-files-found: error

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ModbusForge ${{ steps.version.outputs.tag }}
          draft: ${{ steps.flags.outputs.draft }}
          prerelease: ${{ steps.flags.outputs.prerelease }}
          make_latest: ${{ (github.event_name == 'workflow_dispatch' && steps.flags.outputs.draft == 'true') && 'false' || 'true' }}
          generate_release_notes: false
          body_path: ./release-notes.md
          files: packages/ModbusForge-*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
