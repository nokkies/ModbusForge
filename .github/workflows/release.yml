name: Release

on:
  # Disabled until the new system rebuild is complete.
  # push:
  #   tags:
  #     - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compute version from tag
        id: version
        shell: pwsh
        run: |
          $versionTag = '${{ github.ref_name }}'
          if (-not $versionTag) { $versionTag = 'v0.0.0' }
          $version = $versionTag.TrimStart('v')
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          dotnet build ModbusForge.sln -c Release --no-restore -p:Version=$version -p:AssemblyVersion=$version.0 -p:FileVersion=$version.0

      - name: Publish Avalonia (Windows)
        run: >
          dotnet publish .\ModbusForge\ModbusForge.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          -o .\publish\avalonia\win-x64

      - name: Publish Avalonia (Linux)
        run: >
          dotnet publish .\ModbusForge\ModbusForge.csproj -c Release -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          -o .\publish\avalonia\linux-x64

      - name: Package release artifacts
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $avaloniaWin = ".\publish\avalonia\win-x64"
          $avaloniaLinux = ".\publish\avalonia\linux-x64"
          New-Item -ItemType Directory -Path .\packages -Force | Out-Null

          Compress-Archive -Path "$avaloniaWin\*" -DestinationPath ".\packages\ModbusForge-$version-win-x64.zip" -Force

          $staging = ".\packages\ModbusForge"
          if (Test-Path $staging) { Remove-Item -Path $staging -Recurse -Force }
          Copy-Item -Path $avaloniaLinux -Destination $staging -Recurse
          tar -czf ".\packages\ModbusForge-$version-linux-x64.tar.gz" -C .\packages ModbusForge
          Remove-Item -Path $staging -Recurse -Force

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path .\packages -Filter 'ModbusForge-*'
          foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLower()
            $out = "$hash  $($f.Name)"
            $out | Out-File -FilePath "$($f.FullName).sha256" -Encoding ascii -NoNewline
          }

      - name: Clean stale installer artifacts
        shell: pwsh
        run: |
          if (Test-Path 'installers') {
            Remove-Item -Path 'installers\*.exe' -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          Write-Host "Building installer with version $version..."
          & iscc /DAppVersion=$version setup\ModbusForge.iss
          if (Test-Path .\installers) {
            Write-Host "Avalonia installer created:"
            Get-ChildItem .\installers\*.exe | Select-Object Name,Length
          } else {
            Write-Host "ERROR: installers directory not found!"
            exit 1
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ModbusForge-${{ github.ref_name }}
          path: |
            packages/ModbusForge-*-win-x64.zip
            packages/ModbusForge-*-win-x64.zip.sha256
            packages/ModbusForge-*-linux-x64.tar.gz
            packages/ModbusForge-*-linux-x64.tar.gz.sha256
            installers/ModbusForge-${{ steps.version.outputs.version }}-setup.exe
          if-no-files-found: ignore

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ModbusForge ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Automated release for ${{ github.ref_name }}.
            ModbusForge is now the recommended cross-platform entry point.
            See README.md Changelog for details.
          files: |
            packages/ModbusForge-*-win-x64.zip
            packages/ModbusForge-*-win-x64.zip.sha256
            packages/ModbusForge-*-linux-x64.tar.gz
            packages/ModbusForge-*-linux-x64.tar.gz.sha256
            installers/ModbusForge-${{ steps.version.outputs.version }}-setup.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
